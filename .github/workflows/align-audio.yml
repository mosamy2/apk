name: Align audio
on:
  workflow_dispatch:
    inputs:
      force: { description: "re-align all files (1)", required: false, default: "" }
  push:
    paths: ['audio/**', 'tools/align.py', '.github/workflows/align-audio.yml']
permissions:
  contents: write
  actions: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install faster-whisper
      - run: python tools/align.py
        env:
          FORCE: ${{ github.event.inputs.force }}
      - name: Save timings
        run: |
          git config user.name "align-bot"; git config user.email "bot@users.noreply.github.com"
          git add audio/timings.json audio/inbox_asr.json audio/full_asr.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update audio timings [skip ci]"; git pull --rebase origin main; git push origin main; fi
