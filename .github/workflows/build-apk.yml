name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: node build.mjs
      - run: npx cap add android
      - name: Launcher icons
        continue-on-error: true
        run: |
          npm i --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#7B5CFF' --splashBackgroundColor '#DFF3FF'
      - name: Portrait only
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tasbeeh-kids-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
