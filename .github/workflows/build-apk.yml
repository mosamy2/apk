name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: node build.mjs
      - run: npx cap add android
      - name: Launcher icons
        continue-on-error: true
        run: |
          npm i --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#7B5CFF' --splashBackgroundColor '#DFF3FF'
      - name: Portrait only
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Notification permissions and alert sounds
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><application#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          cp audio/boy_alerts.mp3 audio/girl_alerts.mp3 audio/fx_soft.mp3 android/app/src/main/res/raw/
          mkdir -p android/app/src/main/res/drawable
          cp tools/ic_stat_tk.xml android/app/src/main/res/drawable/
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tasbeeh-kids-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tasbeeh-kids.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tasbeeh-kids.apk --title "سبحة الأبطال - APK" --notes "نزّل ملف tasbeeh-kids.apk وثبّته على الموبايل."
