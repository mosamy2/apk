<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حساب الأهل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:844px;box-sizing:border-box;background:#EEF3FF;font-family:'Noto Sans Arabic',Arial,sans-serif;color:#1F2A5A;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:0 20px">
<div style="margin-top:60px;display:flex;align-items:center;gap:12px"><svg width="60" height="60" viewBox="0 0 64 64" role="img" aria-label="شعار سبحة الأبطال"><rect width="64" height="64" rx="16" fill="#FFE08A"/><circle cx="32.0" cy="10.0" r="4.6" fill="#7B5CFF" stroke="#fff" stroke-width="1"/><circle cx="43.0" cy="12.9" r="4.6" fill="#FF6FA5" stroke="#fff" stroke-width="1"/><circle cx="51.1" cy="21.0" r="4.6" fill="#20B2A6" stroke="#fff" stroke-width="1"/><circle cx="54.0" cy="32.0" r="4.6" fill="#FF8A3D" stroke="#fff" stroke-width="1"/><circle cx="51.1" cy="43.0" r="4.6" fill="#7B5CFF" stroke="#fff" stroke-width="1"/><circle cx="43.0" cy="51.1" r="4.6" fill="#FF6FA5" stroke="#fff" stroke-width="1"/><circle cx="32.0" cy="54.0" r="4.6" fill="#20B2A6" stroke="#fff" stroke-width="1"/><circle cx="21.0" cy="51.1" r="4.6" fill="#FF8A3D" stroke="#fff" stroke-width="1"/><circle cx="12.9" cy="43.0" r="4.6" fill="#7B5CFF" stroke="#fff" stroke-width="1"/><circle cx="10.0" cy="32.0" r="4.6" fill="#FF6FA5" stroke="#fff" stroke-width="1"/><circle cx="12.9" cy="21.0" r="4.6" fill="#20B2A6" stroke="#fff" stroke-width="1"/><circle cx="21.0" cy="12.9" r="4.6" fill="#FF8A3D" stroke="#fff" stroke-width="1"/><path d="M32 18l4.4 9.6 10.4 1.2-7.8 7 2.2 10.2L32 40.4l-9.2 5.6 2.2-10.2-7.8-7 10.4-1.2z" fill="#FF8A3D" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><div><div style="font-size:26px;font-weight:700">{{title}}</div><div style="font-size:13px;color:#44507F">{{sub}}</div></div></div>
<div style="display:flex;gap:8px;margin-top:20px"><button onClick="{{goSignup}}" style="{{goSignupStyle}}">حساب جديد</button><button onClick="{{goLogin}}" style="{{goLoginStyle}}">تسجيل دخول</button></div>
<div style="margin-top:14px"><label for="em" style="display:block;font-size:14px;font-weight:700;margin-bottom:6px">البريد الإلكتروني أو رقم الجوال</label><input id="em" type="text" inputmode="email" placeholder="name@example.com" style="width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:3px solid #FFC93C;background:#fff;padding:0 16px;font-size:17px;font-weight:600;color:#1F2A5A"></div>
<div style="margin-top:14px"><label for="pw" style="display:block;font-size:14px;font-weight:700;margin-bottom:6px">كلمة المرور</label><input id="pw" type="password" placeholder="••••••••"  style="width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:3px solid #FFC93C;background:#fff;padding:0 16px;font-size:17px;font-weight:600;color:#1F2A5A"></div>
<sc-if value="{{isSignup}}" hint-placeholder-val="{{ true }}"><div style="margin-top:14px"><label for="pin" style="display:block;font-size:14px;font-weight:700;margin-bottom:6px">رقم سري للأهل (٤ أرقام)</label><input id="pin" type="password" placeholder="••••" inputmode="numeric" maxlength="4" style="width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:3px solid #FFC93C;background:#fff;padding:0 16px;font-size:17px;font-weight:600;color:#1F2A5A"></div><div style="margin-top:10px"><div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-top:8px"><i style="width:22px;height:22px;border-radius:11px;background:#FFC93C;flex:none"></i>حساب خاص لكل طفل: تقدّمه ونجومه وتنبيهاته</div><div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-top:8px"><i style="width:22px;height:22px;border-radius:11px;background:#20B2A6;flex:none"></i>تتابعون كل أطفالكم من حساب واحد</div><div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-top:8px"><i style="width:22px;height:22px;border-radius:11px;background:#FF6FA5;flex:none"></i>الرقم السري يحمي إعدادات الأهل من الأطفال</div></div></sc-if>
<sc-if value="{{isSignup}}" hint-placeholder-val="{{ true }}"><a href="Welcome.dc.html" style="position:absolute;left:20px;right:20px;bottom:44px;height:60px;border-radius:30px;background:#FF8A3D;box-shadow:0 5px 0 #D86A1F;color:#1F2A5A;font-size:19px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">إنشاء الحساب وإضافة طفل</a></sc-if>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}"><a href="Who.dc.html" style="position:absolute;left:20px;right:20px;bottom:44px;height:60px;border-radius:30px;background:#FF8A3D;box-shadow:0 5px 0 #D86A1F;color:#1F2A5A;font-size:19px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">دخول</a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mode: 'signup' }; }
renderVals() {
const m = this.state.mode;
const st = (on) => 'flex:1;min-height:48px;border-radius:24px;font-size:16px;font-weight:700;color:#1F2A5A;background:' + (on ? '#FFE08A' : '#fff') + ';border:3px solid ' + (on ? '#FF8A3D' : '#C9D3F0');
return { isSignup: m === 'signup', isLogin: m === 'login',
title: m === 'signup' ? 'حساب الأهل' : 'أهلًا بعودتكم',
sub: m === 'signup' ? 'ينشئه الأب أو الأم مرة واحدة' : 'ادخلوا لتروا أطفالكم',
goSignupStyle: st(m === 'signup'), goLoginStyle: st(m === 'login'),
goSignup: () => this.setState({ mode: 'signup' }), goLogin: () => this.setState({ mode: 'login' }) };
}
}
</script>
</body>
</html>
